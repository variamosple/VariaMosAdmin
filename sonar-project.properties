# SonarCloud analysis run by the CI (build-and-test), with the coverage of
# Vitest; automatic analysis is off. Files are listed one by one: the
# tracked .env is never sent.
sonar.organization=variamosple-1
sonar.projectKey=variamosple_VariaMosAdmin

sonar.sources=src,scripts,index.html,Dockerfile,.github
sonar.tests=src,tests,scripts
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/shared/tests/**,scripts/**/*.test.mjs
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/shared/tests/**,tests/**,scripts/**/*.test.mjs

# The coverage measured by Vitest (vitest.config.mts); the scripts are
# checked by their own tests, which report no coverage.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/setupTests.ts,src/index.tsx,src/reportWebVitals.ts,scripts/**
