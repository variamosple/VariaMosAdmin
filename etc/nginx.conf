server {
    listen   3000;
    listen   [::]:3000 default ipv6only=on;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens  off;
    server_name _;

    gzip on;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 0;
    gzip_types text/plain application/javascript text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype;

    # Security headers, written at build time (EV-75 lot 3). add_header in a
    # location replaces the server ones, so each location includes them.

    # Built files carry a hash in their name: a new build gives new names,
    # so the browser keeps them for a year (T-30). A missing one answers 404,
    # not the page, so that an open tab reloads after a deployment.
    location ~ ^(/variamos_admin)?/assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page and the other files are checked at each visit, so that a
    # deployment shows at once
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}