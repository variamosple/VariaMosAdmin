name: Frontend CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Verify commit message format
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login
          != 'dependabot[bot]'
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Audit npm dependencies (gated by audit-exceptions.json)
        run: |
          node scripts/audit-gate.mjs

      - name: Run linter (Biome)
        run: |
          npm run lint

      - name: Verify TypeScript types
        run: |
          npm run typecheck

      - name: Verify Clean Architecture boundaries
        run: |
          npm run check-arch

      - name: Run unit tests with the coverage thresholds
        run: |
          npm run test:coverage

      # The organization's token is not given to Dependabot pull requests
      - name: Analyze with SonarCloud, coverage included
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Verify production build
        run: |
          npm run build

      - name: Run TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          path: ./
          # The image of the same release, not "latest": change it with the
          # SHA above when Dependabot updates the action
          version: 3.99.7

  # Runs next to the checks, one job per browser, each on its own runner:
  # the four run at the same time. `npm run playwright:run:mocked` without
  # arguments still runs Chromium, Firefox and WebKit in one go.
  # Playwright runs in its official image, which already holds these
  # browsers: no apt-get on the Ubuntu mirror, which can take more than 45
  # minutes. Edge (T-31) is installed on the GitHub runner but not in the
  # image, so its job runs on the runner.
  e2e-mocked:
    name: e2e-mocked (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Every browser blocks the required check, Edge included since its five
    # green runs in a row (decision of 2026-11-02, EV-95)
    strategy:
      # Every browser reports, even when another one fails
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            in-docker: '1'
            edge: ''
          - browser: firefox
            in-docker: '1'
            edge: ''
          - browser: webkit
            in-docker: '1'
            edge: ''
          - browser: msedge
            in-docker: ''
            edge: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Show the Edge version
        if: matrix.browser == 'msedge'
        run: |
          /opt/microsoft/msedge/msedge --version

      # Videos of failed tests need the ffmpeg build of Playwright, which
      # the image has and the runner has not
      - name: Install the Playwright ffmpeg
        if: matrix.browser == 'msedge'
        run: |
          npx playwright install ffmpeg

      - name: Run Mocked E2E Tests (${{ matrix.browser }})
        run: |
          npm run playwright:run:mocked -- --project=${{ matrix.browser }}
        env:
          PLAYWRIGHT_IN_DOCKER: ${{ matrix.in-docker }}
          PLAYWRIGHT_EDGE: ${{ matrix.edge }}

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-mocked-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  # The required check: it passes only when the checks and the mocked e2e
  # both pass (a skipped required check would count as passed)
  build-and-test:
    needs: [checks, e2e-mocked]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the checks and the mocked e2e
        run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.e2e-mocked.result }}" = success
