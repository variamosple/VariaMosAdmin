name: Frontend CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Verify commit message format
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login
          != 'dependabot[bot]'
        run: |
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Audit npm dependencies (gated by audit-exceptions.json)
        run: |
          node scripts/audit-gate.mjs

      - name: Run linter (Biome)
        run: |
          npm run lint

      - name: Verify TypeScript types
        run: |
          npm run typecheck

      - name: Verify Clean Architecture boundaries
        run: |
          npm run check-arch

      - name: Run unit tests with the coverage thresholds
        run: |
          npm run test:coverage

      - name: Verify production build
        run: |
          npm run build

      - name: Run TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./

  # Runs next to the checks. Playwright runs in its official image, which
  # already holds the browsers: no apt-get on the Ubuntu mirror, which can
  # take more than 45 minutes.
  e2e-mocked:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run Mocked E2E Tests (Playwright in Docker)
        run: |
          npm run playwright:run:mocked
        env:
          PLAYWRIGHT_IN_DOCKER: 1

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-mocked-report
          path: playwright-report/
          retention-days: 7

  # The required check: it passes only when the checks and the mocked e2e
  # both pass (a skipped required check would count as passed)
  build-and-test:
    needs: [checks, e2e-mocked]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the checks and the mocked e2e
        run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.e2e-mocked.result }}" = success
