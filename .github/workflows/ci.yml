name: Frontend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: |
        npm ci

    - name: Verify commit message format
      if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
      run: |
        npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

    - name: Audit npm dependencies for high vulnerabilities
      run: |
        npm audit --audit-level=high

    - name: Run linter (Biome)
      run: |
        npm run lint

    - name: Verify TypeScript types
      run: |
        npm run typecheck

    - name: Verify Clean Architecture boundaries
      run: |
        npm run check-arch

    - name: Run unit tests
      run: |
        npm run test -- --run --passWithNoTests

    - name: Verify production build
      run: |
        npm run build

    - name: Run TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./

    - name: Run Mocked E2E Tests (Cypress in Docker)
      run: |
        npm run cypress:run:mocked

    - name: Upload Cypress Screenshots and Videos
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: cypress-mocked-screenshots-and-videos
        path: |
          cypress/screenshots
          cypress/videos
        retention-days: 7

