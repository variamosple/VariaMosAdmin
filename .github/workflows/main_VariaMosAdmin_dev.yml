# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# Last updated: 20230623:22:32

name: variamosadmin-main-aws-image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v7

      - name: Record the build start
        run: echo "BUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{vars.ACR_DOKCERHUB}}
          username: ${{secrets.ACRUSERNAME_DOKCERHUB}}
          password: ${{secrets.ACRUSERPASSWORD_DOKCERHUB}}

      - name: Clear .env file content during build
        run: truncate -s 0 .env
        shell: bash

      - name: Set Environment Variables
        run: |
          echo "REACT_APP_ADMIN_API_URL=${{vars.REACT_APP_ADMIN_API_URL}}" >> .env
          echo "VITE_ADMIN_API_URL=${{vars.REACT_APP_ADMIN_API_URL}}" >> .env
          echo "REACT_APP_ADMIN_WS_URL=${{vars.REACT_APP_ADMIN_WS_URL}}" >> .env
          echo "VITE_ADMIN_WS_URL=${{vars.REACT_APP_ADMIN_WS_URL}}" >> .env
          echo "REACT_APP_LANGUAGES_API_URL=${{vars.REACT_APP_LANGUAGES_API_URL}}" >> .env
          echo "VITE_LANGUAGES_API_URL=${{vars.REACT_APP_LANGUAGES_API_URL}}" >> .env
          echo "REACT_APP_PROJECTS_API_URL=${{vars.REACT_APP_PROJECTS_API_URL}}" >> .env
          echo "VITE_PROJECTS_API_URL=${{vars.REACT_APP_PROJECTS_API_URL}}" >> .env
          echo "REACT_APP_GOOGLE_CLIENT_ID=${{vars.REACT_APP_GOOGLE_CLIENT_ID}}" >> .env
          echo "VITE_GOOGLE_CLIENT_ID=${{vars.REACT_APP_GOOGLE_CLIENT_ID}}" >> .env
          echo "REACT_APP_GOOGLE_REDIRECT_URI=${{vars.REACT_APP_GOOGLE_REDIRECT_URI}}" >> .env
          echo "VITE_GOOGLE_REDIRECT_URI=${{vars.REACT_APP_GOOGLE_REDIRECT_URI}}" >> .env
          echo "REACT_APP_LOGIN_URL=\"${{vars.REACT_APP_LOGIN_URL}}\"" >> .env
          echo "VITE_LOGIN_URL=\"${{vars.REACT_APP_LOGIN_URL}}\"" >> .env
          echo "REACT_APP_HOME_PAGE=\"${{vars.REACT_APP_HOME_PAGE}}\"" >> .env
          echo "VITE_HOME_PAGE=\"${{vars.REACT_APP_HOME_PAGE}}\"" >> .env
          echo "REACT_APP_NOTIFICATION_API_URL=\"${{vars.REACT_APP_NOTIFICATION_API_URL}}\"" >> .env
          echo "VITE_NOTIFICATION_API_URL=\"${{vars.REACT_APP_NOTIFICATION_API_URL}}\"" >> .env

      - name: Build and push container image to registry
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{vars.ACR_DOKCERHUB}}/${{secrets.ACRUSERNAME_DOKCERHUB}}/variamosadmin:main
          file: ./Dockerfile

      - name: Deploy changes into the server
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master of 2026-08-16: v1.2.5 plus the drone-ssh checksum check
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.VARIAMOS_AWS_PEM }}
          script: |
            echo "Executing command on remote server..."
            # Keep the image in service: the rollback step puts it back (D6)
            previous=$(sudo docker inspect -f '{{.Image}}' "$(sudo docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml ps -q variamosadminaws)" 2>/dev/null || true)
            if [ -n "$previous" ]; then sudo docker tag "$previous" variamosadminaws:rollback; fi
            sudo docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml pull variamosadminaws
            sudo docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml up -d --force-recreate variamosadminaws
            sudo docker image prune -f

      # The page must come from this run's build (nginx gives the build time as
      # Last-Modified) and its main script must load. Otherwise the previous
      # image is put back and the run stays red (T-25, decision D6).
      - name: Check the deployed page answers
        id: health
        env:
          PAGE_URL: https://app.variamos.com/variamos_admin/
        run: |
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            problem=""
            headers=$(curl -sS --max-time 10 -o page.html -D - "$PAGE_URL" || true)
            modified=$(echo "$headers" | tr -d '\r' | sed -n 's/^[Ll]ast-[Mm]odified: //p')
            script=$(grep -oE 'assets/[A-Za-z0-9_.-]+\.js' page.html 2>/dev/null | head -1)
            if ! echo "$headers" | head -1 | grep -q " 200"; then
              problem="the page does not answer 200"
            elif [ -z "$modified" ] || [ "$(date -d "$modified" +%s)" -lt "$BUILD_STARTED_AT" ]; then
              problem="the page is not the one built by this run (Last-Modified: ${modified:-none})"
            elif [ -z "$script" ] || ! curl -sf --max-time 10 -o /dev/null "$PAGE_URL$script"; then
              problem="its main script does not load (${script:-not found})"
            fi
            if [ -z "$problem" ]; then
              echo "The page built by this run answers (Last-Modified: $modified, $script)"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Within 5 minutes, $problem"
              exit 1
            fi
            sleep 10
          done

      # A migration is not undone: the previous code must accept the schema
      # left by the new one, as every migration so far does
      - name: Roll back to the previous image
        id: rollback
        if: failure() && steps.health.outcome == 'failure'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.VARIAMOS_AWS_PEM }}
          script: |
            set -e
            container=$(sudo docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml ps -q variamosadminaws)
            if ! sudo docker image inspect variamosadminaws:rollback >/dev/null 2>&1; then
              echo "No previous image kept: nothing to roll back to"
              exit 1
            fi
            if [ "$(sudo docker inspect -f '{{.Image}}' "$container")" = "$(sudo docker image inspect -f '{{.Id}}' variamosadminaws:rollback)" ]; then
              echo "The service still runs the previous image: nothing was rolled back"
              exit 1
            fi
            # The compose file names the image: that name points back to the previous one
            sudo docker tag variamosadminaws:rollback "$(sudo docker inspect -f '{{.Config.Image}}' "$container")"
            sudo docker compose --env-file .env.aws.develop -f docker-compose-aws-develop-nginx.yml up -d --force-recreate --pull never variamosadminaws
            echo "Rolled back to the previous image"

      - name: Check the rolled back page answers
        if: failure() && steps.rollback.outcome == 'success'
        env:
          PAGE_URL: https://app.variamos.com/variamos_admin/
        run: |
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            script=$(curl -sf --max-time 10 "$PAGE_URL" | grep -oE 'assets/[A-Za-z0-9_.-]+\.js' | head -1 || true)
            if [ -n "$script" ] && curl -sf --max-time 10 -o /dev/null "$PAGE_URL$script"; then
              echo "::warning::The page was rolled back to the previous image and answers"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::The page does not answer after the rollback either"
              exit 1
            fi
            sleep 10
          done
