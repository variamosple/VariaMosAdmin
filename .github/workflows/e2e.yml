name: Frontend Real E2E CI

on:
  pull_request:
    branches:
      - main

jobs:
  e2e-real:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: variamos_db
          POSTGRES_USER: variamos_admin
          POSTGRES_PASSWORD: variamos_db_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout VariaMosAdmin (frontend)
      uses: actions/checkout@v4

    - name: Checkout variamos_ms_admin (backend)
      uses: actions/checkout@v4
      with:
        repository: variamosple/variamos_ms_admin
        path: variamos_ms_admin

    - name: Checkout variamos_ms_languages
      uses: actions/checkout@v4
      with:
        repository: variamosple/variamos_ms_languages
        path: variamos_ms_languages

    - name: Checkout vms_projects
      uses: actions/checkout@v4
      with:
        repository: variamosple/vms_projects
        path: vms_projects

    - name: Initialize PostgreSQL database schema
      run: |
        PGPASSWORD=variamos_db_password psql -h localhost -U variamos_admin -d variamos_db -f cypress/support/db/VariamosDB.sql
        PGPASSWORD=variamos_db_password psql -h localhost -U variamos_admin -d variamos_db -f cypress/support/db/config.sql
        PGPASSWORD=variamos_db_password psql -h localhost -U variamos_admin -d variamos_db -f cypress/support/db/seeds.sql

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install frontend dependencies
      run: |
        npm ci

    - name: Start Microservices (Docker Compose)
      run: |
        npm run docker:test:up
      env:
        VARIAMOS_WORKSPACE_DIR: ./

    - name: Run Real E2E Tests (Cypress)
      uses: cypress-io/github-action@v6
      with:
        start: npm start
        wait-on: 'http://localhost:3000, http://localhost:4000/version'
        wait-on-timeout: 120
        command: npx cypress run --spec "cypress/integration/**/*.real.spec.js"
      env:
        VARIAMOS_WORKSPACE_DIR: ./
        DB_USER: variamos_admin
        DB_PASSWORD: variamos_db_password
        DB_HOST: localhost
        DB_DATABASE: variamos_db
        DB_PORT: 5432
        DB_SCHEMA: variamos

    - name: Stop Microservices (Docker Compose)
      if: always()
      run: |
        npm run docker:test:down
      env:
        VARIAMOS_WORKSPACE_DIR: ./

    - name: Upload Cypress Screenshots and Videos
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-real-screenshots-and-videos
        path: |
          cypress/screenshots
          cypress/videos
        retention-days: 7
