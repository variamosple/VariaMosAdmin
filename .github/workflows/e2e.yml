name: Frontend Real E2E CI

# On main, the run also writes the layers of the test images to the cache
# that the pull requests read (docker-compose.ci-cache-write.yml)
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The real e2e in five parts, one runner each (EV-118): each part has its own
# database and its own services, so the parts share nothing. In a part, the
# tests still run one at a time: they share that database and its settings.
jobs:
  e2e-real:
    name: e2e-real (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every part reports, even when another one fails
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Stop native PostgreSQL and start test container
        run: |
          # 1. Forcefully stop native host PostgreSQL and free port 5432
          sudo systemctl stop postgresql || true
          sudo systemctl disable postgresql || true
          sudo fuser -k 5432/tcp || true

          # 2. Start PostgreSQL container on port 5432
          docker run --name postgres -e POSTGRES_USER=variamos_admin -e POSTGRES_PASSWORD=variamos_db_password -e POSTGRES_DB=VariamosDB -p 5432:5432 -d postgres:15

          # 3. Wait for PostgreSQL container to be ready
          until docker exec postgres pg_isready -U variamos_admin -d VariamosDB; do
            echo "Waiting for PostgreSQL container to start..."
            sleep 1
          done

      - name: Checkout VariaMosAdmin (frontend)
        uses: actions/checkout@v7

      - name: Resolve backend ref (same branch name if it exists, else main)
        id: backend-ref
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if gh api "repos/variamosple/variamos_ms_admin/branches/${BRANCH//\//%2F}" >/dev/null 2>&1; then
            echo "ref=${BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "No backend branch named ${BRANCH}; using main."
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout variamos_ms_admin (backend)
        uses: actions/checkout@v7
        with:
          repository: variamosple/variamos_ms_admin
          path: variamos_ms_admin
          ref: ${{ steps.backend-ref.outputs.ref }}

      - name: Checkout variamos_ms_languages
        uses: actions/checkout@v7
        with:
          repository: variamosple/variamos_ms_languages
          path: variamos_ms_languages

      - name: Checkout vms_projects
        uses: actions/checkout@v7
        with:
          repository: variamosple/vms_projects
          path: vms_projects

      - name: Checkout variamos_ms_notifications
        uses: actions/checkout@v7
        with:
          repository: variamosple/variamos_ms_notifications
          path: variamos_ms_notifications

      - name: Checkout semantic_translator
        uses: actions/checkout@v7
        with:
          repository: variamosple/semantic_translator
          path: semantic_translator

      - name: Checkout vms_domain_application
        uses: actions/checkout@v7
        with:
          repository: variamosple/vms_domain_application
          path: vms_domain_application

      - name: Checkout vms_requirements_autocomplete
        uses: actions/checkout@v7
        with:
          repository: variamosple/vms_requirements_autocomplete
          path: vms_requirements_autocomplete

      - name: Ensure Docker socket permissions
        run: |
          sudo chmod 666 /var/run/docker.sock
          ls -la /var/run/docker.sock

      - name: Patch Backend for verbose Docker logging
        run: |
          sed -i 's/logger.warn(`Failed to dynamically discover/logger.err(`[CRITICAL] Failed to dynamically discover service definitions: ${err.message}\\n${err.stack}`/g' variamos_ms_admin/src/DataProviders/MicroService/MicroServiceRepository.ts
          sed -i 's/logger.warn(`Docker listContainers warning/logger.err(`Docker listContainers CRITICAL/g' variamos_ms_admin/src/DataProviders/MicroService/MicroServiceRepository.ts

      - name: Generate E2E Test Credentials & Keys
        run: |
          # Generate RS256 private and public keys for token authentication
          openssl genrsa -out ./variamos_ms_admin/jwtRS256.key 2048
          openssl rsa -in ./variamos_ms_admin/jwtRS256.key -pubout -out ./variamos_ms_admin/jwtRS256.key.pub
          # Throwaway test keys, read by the admin container as uid 1000 (EV-71 lot 5)
          chmod 644 ./variamos_ms_admin/jwtRS256.key ./variamos_ms_admin/jwtRS256.key.pub

          # Create dummy credentials.json for projects microservice
          echo '{}' > ./vms_projects/credentials.json

      - name: Initialize PostgreSQL database schema
        run: |
          PGPASSWORD=variamos_db_password psql -h 127.0.0.1 -U variamos_admin -d VariamosDB -v ON_ERROR_STOP=1 -f tests/db/VariamosDB.sql
          PGPASSWORD=variamos_db_password PGOPTIONS="-c search_path=variamos,public" psql -h 127.0.0.1 -U variamos_admin -d VariamosDB -v ON_ERROR_STOP=1 -f tests/db/config.sql

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node26-${{ hashFiles('package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: |
          npm ci --ignore-scripts

      # A BuildKit builder, which can read and write the GitHub Actions cache
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # docker compose reaches the cache with the runtime variables of the
      # runner, which only actions see: they are given to the next steps.
      # Set just before the tests, after the dependencies are installed.
      - name: Give the cache variables to docker compose
        uses: actions/github-script@v9
        with:
          script: |
            for (const [name, value] of Object.entries(process.env)) {
              if (name.startsWith('ACTIONS_') && value) {
                core.setSecret(value);
                core.exportVariable(name, value);
              }
            }

      - name: Run part ${{ matrix.shard }} of the real E2E tests (Playwright)
        run: |
          npm run playwright:run:real
        env:
          VARIAMOS_WORKSPACE_DIR: ./
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          # The cache is read everywhere and written by part 1 on main
          COMPOSE_FILE: ${{ github.event_name == 'push' && matrix.shard == 1 && 'docker-compose.test.yml:docker-compose.ci-cache.yml:docker-compose.ci-cache-write.yml' || 'docker-compose.test.yml:docker-compose.ci-cache.yml' }}
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}/5
          PLAYWRIGHT_WORKERS: 1
          PLAYWRIGHT_IN_DOCKER: 1

      - name: Print Docker Container Logs on Failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs
        env:
          VARIAMOS_WORKSPACE_DIR: ./

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-real-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
