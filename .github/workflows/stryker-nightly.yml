name: Mutation Testing (Stryker)

# The run is the shared workflow of the organization:
# https://github.com/variamosple/.github/blob/main/.github/workflows/stryker.yml
# It fails under the break threshold of stryker.config.json and publishes the
# score as the commit status "Stryker / Mutation Score". Pull requests are not
# blocked.

on:
  workflow_dispatch:
  schedule:
    # Every day at 05:00 UTC (GitHub Actions cron expressions are always UTC).
    - cron: '0 5 * * *'

permissions:
  statuses: write
  contents: read

jobs:
  stryker:
    uses: variamosple/.github/.github/workflows/stryker.yml@v1
